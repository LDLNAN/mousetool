[package]
name = "mousetool-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
getrandom = { version = "0.4", features = ["std"] }
httparse = "1"
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
subtle = "2.6"
tempfile = "3"
url = "2"
